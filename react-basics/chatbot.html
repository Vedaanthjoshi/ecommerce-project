<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
   <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput(){
            return(
                <>
                    <input placeholder="send a message to chatbot" size="30 "/>
                    <button>Send</button>
                </>
            );
        }
        function ChatMessage({message,sender}){
            // const message=props.message;
            // const sender=props.sender;
            return(
                <div>
                    {sender==="robot" && <img src="robot.png" width="50"/>}
                    {message}
                    {sender==="user" && <img src="user.png" width="50"/>}
                </div>
            );
        }
        function  App(){
            return(
            <>
            <ChatInput/>
            <ChatMessage message="behen ke lowde" sender="user"/>
            <ChatMessage message="Hello! How can I help you?" sender="robot"/>
            <ChatMessage message="hi" sender="user"/>
            <ChatMessage message="Sorry, I didn't quite understand that. Currently, I only know how to flip a coin, roll a dice, or get today's date. Let me know how I can help!" sender="robot"/>
            <ChatMessage message="flip a coinb" sender="user"/>
            <ChatMessage message="Sure! You got heads" sender="robot"/>
            </>
        );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
